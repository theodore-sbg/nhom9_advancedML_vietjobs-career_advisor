[project]
name = "career-advisor"
version = "0.1.0"
description = "Trợ lý tư vấn nghề nghiệp từ tin tuyển dụng VietJobs bằng KG-RAG và Multi-Agent"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
