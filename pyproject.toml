[project]
name = "career-advisor"
version = "0.1.0"
description = "Trợ lý tư vấn nghề nghiệp từ tin tuyển dụng VietJobs bằng KG-RAG và Multi-Agent"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "google-genai>=1.0",
    "anthropic>=0.40",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "networkx>=3.2",
    "rank-bm25>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["data: cần dữ liệu thật trong data/raw/"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
